name: Android CI

on:
  push:
    branches: [RY-DEV]
  pull_request:
    branches: [RY-DEV]

permissions:
  contents: read

jobs:
  verify:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android 17 API 37.1 preview platform
        run: sdkmanager --channel=3 "platforms;android-37.1" "build-tools;37.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run unit tests and assemble
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RSounds-test-reports
          path: "**/build/test-results/**/*.xml"
          if-no-files-found: warn
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RSounds-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
