name: Android CI

on:
  push:
    branches: [RY-DEV]
  pull_request:
    branches: [RY-DEV]

permissions:
  contents: read

jobs:
  verify:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run unit tests and assemble
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
